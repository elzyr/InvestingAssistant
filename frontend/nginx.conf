map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=market_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html index.htm;

    resolver 127.0.0.11 valid=5s ipv6=off;

    client_max_body_size 12M;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_http_version 1.1;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/wasm image/svg+xml font/woff2;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~ ^/api/market/analytics/monte-carlo/?$ {
        return 403;
    }

    location ~ ^/api/(prices|currencies)(/history)?/batch/?$ {
        return 403;
    }

    location ~ ^/api/(prices|currencies|market)(/|$) {
        limit_req zone=market_limit burst=40 nodelay;
        limit_req_status 429;
        set $market_data "http://market-data-service:8083";
        proxy_pass $market_data;
    }

    location ~ ^/api/expenses/(statements/preview|reclassify)$ {
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        set $backend "http://backend:8080";
        proxy_pass $backend;
    }

    location ~ ^/api/auth(/|$) {
        limit_req zone=auth_limit burst=15 nodelay;
        limit_req_status 429;
        set $backend "http://backend:8080";
        proxy_pass $backend;
    }

    location /api/ {
        set $backend "http://backend:8080";
        proxy_pass $backend;
    }
}
