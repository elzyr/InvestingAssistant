spring.application.name=portfolio-service
server.port=8082
# Database Configuration with env variables and fallback defaults
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/investing_assistant}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:adminpass}
# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
