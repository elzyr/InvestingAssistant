spring.application.name=portfolio-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/investing_assistant}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

services.instrument-service.url=${INSTRUMENT_SERVICE_URL:http://localhost:8084}
services.market-data-service.url=${MARKET_DATA_SERVICE_URL:http://localhost:8083}
