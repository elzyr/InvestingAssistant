spring.application.name=backend
server.port=8080
spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/investing_assistant}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

services.market-data-service.url=${MARKET_DATA_SERVICE_URL:http://localhost:8083}

spring.messages.basename=messages
spring.messages.encoding=UTF-8

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.security.cookie-secure=${APP_COOKIE_SECURE:true}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.expenses.llm.provider=${EXPENSE_LLM_PROVIDER:ollama}
app.expenses.llm.model=${EXPENSE_LLM_MODEL:tev1:4b}
app.expenses.llm.base-url=${EXPENSE_LLM_BASE_URL:http://host.docker.internal:11434}
app.expenses.llm.num-ctx=${EXPENSE_LLM_NUM_CTX:16384}
