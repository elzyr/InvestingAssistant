spring.application.name=backend
server.port=8080
spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/investing_assistant}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

services.market-data-service.url=${MARKET_DATA_SERVICE_URL:http://localhost:8083}
