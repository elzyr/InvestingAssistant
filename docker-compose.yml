services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: investassist-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JPA_DDL_AUTO=update
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data-service:
        condition: service_started
    networks:
      - investassist-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: investassist-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - investassist-network
    restart: always

  market-data-service:
    build:
      context: ./market-data-service
      dockerfile: Dockerfile
    container_name: investassist-market-data
    expose:
      - "8083"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_PORT=8083
      - MARKET_DB_PATH=/app/data/market_history.db
    volumes:
      - market_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - investassist-network
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: investassist-postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - investassist-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: investassist-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - market-data-service
    networks:
      - investassist-network
    restart: always

volumes:
  market_data:
  redis_data:
  postgres_data:

networks:
  investassist-network:
    driver: bridge
