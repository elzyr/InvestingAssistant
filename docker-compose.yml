services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: investassist-gateway
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - PORTFOLIO_SERVICE_URL=http://portfolio-service:8082
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8083
      - INSTRUMENT_SERVICE_URL=http://instrument-service:8084
      - ANALYTICS_SERVICE_URL=http://analytics-service:8085
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - auth-service
      - portfolio-service
      - market-data-service
      - instrument-service
      - analytics-service
    networks:
      - investassist-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: investassist-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - investassist-network
    restart: always

  market-data-service:
    build:
      context: ./market-data-service
      dockerfile: Dockerfile
    container_name: investassist-market-data
    ports:
      - "8083:8083"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_PORT=8083
    depends_on:
      - redis
    networks:
      - investassist-network
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: investassist-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-postgres}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - investassist-network
    restart: always

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: investassist-auth
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/auth_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - investassist-network
    restart: always

  portfolio-service:
    build:
      context: ./portfolio-service
      dockerfile: Dockerfile
    container_name: investassist-portfolio
    ports:
      - "8082:8082"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/investing_assistant
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JPA_DDL_AUTO=update
      - INSTRUMENT_SERVICE_URL=http://instrument-service:8084
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8083
    depends_on:
      - postgres
      - instrument-service
      - market-data-service
    networks:
      - investassist-network
    restart: always

  instrument-service:
    build:
      context: ./instrument-service
      dockerfile: Dockerfile
    container_name: investassist-instrument
    ports:
      - "8084:8084"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/instrument_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - postgres
    networks:
      - investassist-network
    restart: always

  kafka:
    image: apache/kafka:3.7.0
    container_name: investassist-kafka
    ports:
      - "29092:29092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:29093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - investassist-network
    restart: always

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: investassist-analytics
    ports:
      - "8085:8085"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - investassist-network
    restart: always

volumes:
  redis_data:
  postgres_data:
  kafka_data:

networks:
  investassist-network:
    driver: bridge
