services:
  redis:
    image: redis:7-alpine
    container_name: investassist-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - investassist-network
    restart: always

  market-data-service:
    build:
      context: ./market-data-service
      dockerfile: Dockerfile
    container_name: investassist-market-data
    ports:
      - "8083:8083"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_PORT=8083
    depends_on:
      - redis
    networks:
      - investassist-network
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: investassist-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-postgres}
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-adminpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - investassist-network
    restart: always

  portfolio-service:
    build:
      context: ./portfolio-service
      dockerfile: Dockerfile
    container_name: investassist-portfolio
    ports:
      - "8082:8082"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/investing_assistant
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-adminpass}
    depends_on:
      - postgres
    networks:
      - investassist-network
    restart: always

  instrument-service:
    build:
      context: ./instrument-service
      dockerfile: Dockerfile
    container_name: investassist-instrument
    ports:
      - "8084:8084"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/instrument_db
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-adminpass}
    depends_on:
      - postgres
    networks:
      - investassist-network
    restart: always

volumes:
  redis_data:
  postgres_data:

networks:
  investassist-network:
    driver: bridge
